name: CI

# Node versions come from .nvmrc, never inlined here, so "what the maintainer
# develops on" is stated once. Two jobs additionally run a matrix over the
# supported floor from package.json engines (20) as well as .nvmrc's version:
# the unit tests and the bundled MCP smoketest, because those are where a
# runtime behaviour difference actually shows. That is not hypothetical - V8
# changed JSON.stringify's nesting limit between Node 21 and 22, and a test
# passing on the maintainer's 24 failed on CI's 20 (see #116). The bundled server
# is also the artifact designers run with whatever Node they happen to have.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # Allow this workflow to be called by other workflows

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Run ESLint
        run: npm run lint

  # The suite existed long before this job did, so 600+ tests gated nothing and a
  # broken one could merge unnoticed. Added while fixing #116, whose own
  # regression test lives here.
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  typecheck:
    name: Type Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck` also checks mcp-server, whose sources import ws, zod
      # and the MCP SDK from its own node_modules.
      - name: Install MCP server dependencies
        run: npm ci --prefix mcp-server

      - name: Run TypeScript compiler
        run: npm run typecheck

  mcp-smoketest:
    name: MCP Server Smoketest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm ci --prefix mcp-server

      - name: Bundle and smoketest the MCP server
        run: npm run mcp:smoketest

  mcp-smoketest-src:
    name: MCP Server Smoketest (raw source)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The raw-source path runs under --experimental-strip-types, which needs
      # Node >=22.6 — this is the exact command the dev MCP config uses. Running
      # it here catches ESM/CJS boundary regressions (an ESM mcp-server import
      # reaching into a commonjs-scoped .ts) that the bundled smoketest cannot,
      # because bundling erases the module boundary.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm ci --prefix mcp-server

      - name: Smoketest the MCP server from raw source
        run: npm run mcp:smoketest:src

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm ci --prefix mcp-server

      - name: Build plugin
        run: npm run build

      - name: Assemble and structurally check the Claude Code plugin
        run: npm run build:plugin

      - name: Validate manifest.json
        run: |
          if ! jq empty manifest.json; then
            echo "❌ Invalid manifest.json"
            exit 1
          fi
          echo "✅ manifest.json is valid"

      - name: Check build artifacts
        run: |
          if [ ! -f "dist/code.js" ]; then
            echo "❌ dist/code.js not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ dist/index.html not found"
            exit 1
          fi
          echo "✅ Build artifacts present"

      - name: Check bundle size
        run: |
          CODE_SIZE=$(wc -c < dist/code.js)
          UI_SIZE=$(wc -c < dist/index.html)
          TOTAL_SIZE=$((CODE_SIZE + UI_SIZE))
          # The Icon Finder pHash DB dominates the UI bundle. It ships
          # gzip+base64-compressed (db/decode.ts), ~4.6MB total. 6MB leaves
          # headroom for icon growth while still catching an uncompressed
          # (~14.6MB) regression.
          MAX_SIZE=$((6 * 1024 * 1024))  # 6MB

          echo "📦 Bundle sizes:"
          echo "  code.js: $(numfmt --to=iec-i --suffix=B $CODE_SIZE)"
          echo "  index.html: $(numfmt --to=iec-i --suffix=B $UI_SIZE)"
          echo "  Total: $(numfmt --to=iec-i --suffix=B $TOTAL_SIZE)"

          if [ $TOTAL_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Bundle size exceeds 6MB limit"
            exit 1
          fi
          echo "✅ Bundle size within limits"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: |
            dist/
            manifest.json
          retention-days: 7
