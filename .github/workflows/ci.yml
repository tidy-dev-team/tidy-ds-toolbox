name: CI

# No Node version is written in this file. Single-version jobs read .nvmrc
# directly; the two matrix jobs get their versions from the `versions` job below,
# which derives them from .nvmrc and package.json `engines`. Bump either of those
# and CI follows, with nothing here to leave stale.
#
# Why a matrix at all, rather than just tracking .nvmrc: running only the newest
# Node is what would hide a runtime difference. V8 changed JSON.stringify's
# nesting limit between Node 21 and 22, and a #116 test that passed on the
# maintainer's 24 failed on CI's 20. The unit tests and the bundled MCP smoketest
# are where such a difference shows, and the bundled server is the artifact
# designers run with whatever Node they happen to have.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # Allow this workflow to be called by other workflows

jobs:
  # The one place versions are computed. `floor` comes from package.json engines,
  # `dev` from .nvmrc; each is reduced to its major (so a range like ">=20" and a
  # pinned "24.10.0" both work). `unique` collapses them to a single leg when they
  # agree, so setting engines to match .nvmrc does the sane thing rather than
  # running the same version twice.
  versions:
    name: Resolve Node versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve from .nvmrc and package.json engines
        id: resolve
        run: |
          set -euo pipefail
          floor="$(jq -r '.engines.node' package.json | grep -oE '[0-9]+' | head -1)"
          dev="$(grep -oE '[0-9]+' .nvmrc | head -1)"
          if [ -z "$floor" ] || [ -z "$dev" ]; then
            echo "could not resolve Node versions (floor='$floor' dev='$dev')" >&2
            exit 1
          fi
          matrix="$(jq -cn --arg f "$floor" --arg d "$dev" '[$f, $d] | unique')"
          echo "resolved Node matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Root install also installs mcp-server's tree, via postinstall - several
      # scripts here (typecheck, mcp:smoketest, build:plugin) need both.
      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Run ESLint
        run: npm run lint

  # The suite existed long before this job did, so 600+ tests gated nothing and a
  # broken one could merge unnoticed. Added while fixing #116, whose own
  # regression test lives here.
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  typecheck:
    name: Type Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  mcp-smoketest:
    name: MCP Server Smoketest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bundle and smoketest the MCP server
        run: npm run mcp:smoketest

  mcp-smoketest-src:
    name: MCP Server Smoketest (raw source)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The raw-source path runs under --experimental-strip-types, which needs
      # Node >=22.6 — this is the exact command the dev MCP config uses. Running
      # it here catches ESM/CJS boundary regressions (an ESM mcp-server import
      # reaching into a commonjs-scoped .ts) that the bundled smoketest cannot,
      # because bundling erases the module boundary.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Smoketest the MCP server from raw source
        run: npm run mcp:smoketest:src

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Assemble and structurally check the Claude Code plugin
        run: npm run build:plugin

      - name: Validate manifest.json
        run: |
          if ! jq empty manifest.json; then
            echo "❌ Invalid manifest.json"
            exit 1
          fi
          echo "✅ manifest.json is valid"

      - name: Check build artifacts
        run: |
          if [ ! -f "dist/code.js" ]; then
            echo "❌ dist/code.js not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ dist/index.html not found"
            exit 1
          fi
          echo "✅ Build artifacts present"

      - name: Check bundle size
        run: |
          CODE_SIZE=$(wc -c < dist/code.js)
          UI_SIZE=$(wc -c < dist/index.html)
          TOTAL_SIZE=$((CODE_SIZE + UI_SIZE))
          # The Icon Finder pHash DB dominates the UI bundle. It ships
          # gzip+base64-compressed (db/decode.ts), ~4.6MB total. 6MB leaves
          # headroom for icon growth while still catching an uncompressed
          # (~14.6MB) regression.
          MAX_SIZE=$((6 * 1024 * 1024))  # 6MB

          echo "📦 Bundle sizes:"
          echo "  code.js: $(numfmt --to=iec-i --suffix=B $CODE_SIZE)"
          echo "  index.html: $(numfmt --to=iec-i --suffix=B $UI_SIZE)"
          echo "  Total: $(numfmt --to=iec-i --suffix=B $TOTAL_SIZE)"

          if [ $TOTAL_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Bundle size exceeds 6MB limit"
            exit 1
          fi
          echo "✅ Bundle size within limits"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: |
            dist/
            manifest.json
          retention-days: 7
